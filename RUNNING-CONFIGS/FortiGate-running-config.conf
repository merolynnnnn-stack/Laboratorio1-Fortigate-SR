# del laboratorio. La configuración del firewall fue realizada
# mediante la interfaz gráfica (GUI).
# ============================================================
# ============================================================
# INTERFACES Y VLANs
# ============================================================

config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http
        set type physical
    next

    edit "port2"
        set vdom "root"
        set type physical
    next

    edit "port3"
        set vdom "root"
        set ip 192.168.244.2 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next

    edit "VLAN10-USUARIOS"
        set vdom "root"
        set ip 10.8.27.1 255.255.255.128
        set allowaccess ping https http
        set alias "Usuarios"
        set device-identification enable
        set role lan
        set interface "port2"
        set vlanid 10
    next

    edit "VLAN20-SERVERS"
        set vdom "root"
        set ip 10.8.27.129 255.255.255.240
        set allowaccess ping
        set alias "Servidores"
        set device-identification enable
        set role lan
        set interface "port2"
        set vlanid 20
    next
end


# ============================================================
# DHCP - VLAN 10 USUARIOS
# ============================================================

config system dhcp server
    edit 2
        set dns-service default
        set default-gateway 10.8.27.1
        set netmask 255.255.255.128
        set interface "VLAN10-USUARIOS"

        config ip-range
            edit 1
                set start-ip 10.8.27.2
                set end-ip 10.8.27.126
            next
        end
    next
end


# ============================================================
# OBJETOS DE DIRECCIONES
# ============================================================

config firewall address
    edit "WEB-SERVER"
        set associated-interface "VLAN20-SERVERS"
        set subnet 10.8.27.130 255.255.255.255
    next

    edit "DB-SERVER"
        set associated-interface "VLAN20-SERVERS"
        set subnet 10.8.27.131 255.255.255.255
    next
end


# ============================================================
# SERVICIO TEMPORAL TCP/8080
# Utilizado durante las pruebas controladas del IPS y File Filter
# ============================================================

config firewall service custom
    edit "TCP-8080"
        set tcp-portrange 8080
    next
end


# ============================================================
# POLÍTICAS DE FIREWALL
# ============================================================

config firewall policy

    edit 1
        set name "SERVERS-INTERNET"
        set srcintf "VLAN20-SERVERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next

    edit 2
        set name "USUARIOS-WEB-HTTPS"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "VLAN20-SERVERS"
        set action accept
        set srcaddr "all"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTPS" "TCP-8080"
        set utm-status enable
        set inspection-mode proxy
        set profile-protocol-options "CUSTOM-WEB-PORTS"
        set ssl-ssh-profile "custom-deep-inspection"
        set file-filter-profile "BLOCK-EXE-DOWNLOADS"
        set ips-sensor "SQL-INJECTION-PROTECTION"
        set logtraffic all
    next

    edit 3
        set name "BLOQUEO-USUARIOS-DB"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "all"
        set dstaddr "DB-SERVER"
        set schedule "always"
        set service "MYSQL"
        set logtraffic all
    next
end


# ============================================================
# DEEP PACKET INSPECTION (DPI)
# ============================================================

config firewall ssl-ssh-profile
    edit "custom-deep-inspection"
        set comment "Customizable deep inspection profile."

        config ssl
            set inspect-all deep-inspection
        end

        config https
        end

        config ftps
        end

        config imaps
        end

        config pop3s
        end

        config smtps
        end

        config ssh
            set ports 22
            set status disable
        end

        config dot
            set status deep-inspection
        end
    next
end


# ============================================================
# IPS - PROTECCIÓN CONTRA SQL INJECTION
# ============================================================

config ips sensor
    edit "SQL-INJECTION-PROTECTION"
        set block-malicious-url enable

        config entries
            edit 2
                set rule 15621
                set status enable
                set log-packet enable
                set action block
            next
        end
    next
end


# ============================================================
# FILE FILTER - BLOQUEO DE ARCHIVOS .EXE
# ============================================================

config file-filter profile
    edit "BLOCK-EXE-DOWNLOADS"
        set comment "Bloqueo de archivos ejecutables para usuarios"

        config rules
            edit "BLOCK-EXE"
                set comment "Bloqueo de descargas de archivos ejecutables"
                set protocol http
                set action block
                set direction incoming
                set file-type "exe"
            next
        end
    next
end


# ============================================================
# PROTECCIÓN DoS DEL WEB SERVER
# ============================================================

config firewall DoS-policy
    edit 1
        set name "PROTECCION-DOS-WEB"
        set interface "VLAN10-USUARIOS"
        set srcaddr "all"
        set dstaddr "WEB-SERVER"
        set service "HTTPS"

        config anomaly
            edit "tcp_syn_flood"
                set status enable
                set log enable
                set action block
                set threshold 2000
            next
        end
    next
end
